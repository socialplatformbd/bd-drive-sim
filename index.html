h1.connect(hg);h2.connect(hg);hg.connect(AC.destination);hornO=hg;hornF=[h1,h2];

traffic.forEach((v,k)=>{const u=v.userData;v.position.set(u.bx,0,-70-k*28);u.cur=u.sp;u.yl=0;rollV(v);});
ground.material.color.set(GC[biomeAt(0)]);envUpdate(0);applyGfx();
$('menu').style.display='none';state='play';
say(T('hint'),5000);
}

/* ---------- আপডেট ---------- */
function update(dt,T0){
const on=fuel>0,thr=(inp.g&&on)?1:0;
tm+=dt;shiftT=Math.max(0,shiftT-dt);
let sg=speed<0?-1:1;
if(auto&&on&&speed>=0&&!inp.rv){
if(gear===0)gear=1;
if(rpm>2150&&gear<5&&shiftT<=0){gear++;shiftT=.35;clunk();}
else if(rpm<1000&&gear>1&&thr&&shiftT<=0){gear--;shiftT=.35;clunk();}
else if(gear>1&&!thr&&speed<GV[gear-1]*.5&&shiftT<=0){gear--;shiftT=.35;clunk();}
}
if(inp.rv&&speed>.3)speed-=10*dt;
if(inp.rv&&on&&speed<=.3){speed=Math.max(-6,speed-CFG.acc*.8*dt);sg=-1;}
else if(thr&&gear>=1&&shiftT<=0&&speed>=0){
const ra=speed/GV[gear];
speed+=GA[gear]*(ra<.2?.35+ra*2:(ra<.85?1:Math.max(0,1-(ra-.85)*6.67)))*dt;
}
else if(thr&&speed<0)speed+=14*dt;
else speed-=sg*(on?(gear>=1?2.4:1.1):3.5)*dt;
if(gear>=1&&speed>GV[gear]*1.05)speed-=3*dt;
if(inp.b)speed-=sg*18*(1+.12*SV.u.t)*(weather==='rain'?.7+.05*SV.u.t:1)*dt;
const px=P.position.x,pz=P.position.z;
let pad=false,ps=null,fz=false,lp=null;
for(const s of stops){if(Math.abs(pz-s.z)<16&&px<-5){pad=true;ps=s;}}
for(const z of fuels){if(Math.abs(pz-z)<16&&px<-5){pad=true;fz=true;}}
for(const l of locals){if(Math.abs(pz-l.z)<14&&px<-5){pad=true;lp=l;}}
if(!pad&&Math.abs(px)>6.3)speed-=sg*CFG.acc*.7*dt;
if(speed*sg<0)speed=0;
steer+=((inp.r-inp.l)-steer)*Math.min(1,dt*6);
const sf=Math.min(1,Math.abs(speed)/6);
P.position.x=Math.max(-14,Math.min(7.5,px+steer*CFG.turn*(1+.05*SV.u.t)*(weather==='rain'?.8+.04*SV.u.t:1)*sf*dt));
for(const b of bridges){if(P.position.z<b.z0&&P.position.z>b.z1){P.position.x=Math.max(-5.2,Math.min(5.4,P.position.x));if(!b.a){b.a=1;say('🌉 '+(lang==='bn'?b.bn:b.en),3500);}}}
P.position.z-=speed*dt;P.rotation.y=-steer*.12*sf*(speed<0?-1:1);
model.rotation.z=veh==='bike'?-steer*.35*sf:0;

/* আরপিএম ও গিয়ারের ইশারা */
let tr=0;
if(on){
if(inp.rv)tr=800+Math.min(1,Math.abs(speed)/6)*700;
else if(gear===0||shiftT>0)tr=800+(thr?900:0);
else tr=800+Math.min(1.15,Math.abs(speed)/GV[gear])*1500+thr*80;
}
rpm+=(tr-rpm)*Math.min(1,dt*6);
if(!auto&&thr&&tm-lastHint>5){
if(gear>=1&&gear<5&&speed>GV[gear]*.93){say(T('upsh'),2000);lastHint=tm;}
else if(gear>=3&&speed<GV[gear]*.18){say(T('lug'),2500);lastHint=tm;}
}

/* ফুয়েল */
fuel-=Math.abs(speed)*dt*SC/1000*(veh==='bike'?.9:.714)*(1-.15*SV.u.f)+(on?dt*.003:0);if(fuel<0)fuel=0;
if(fuel<15&&fuel>0&&!lowWarn){lowWarn=true;say(T('low'),4500);}
if(fuel>25)lowWarn=false;
if(fuel<=0&&on===false&&fc%120===0)say(T('nof'),2500);
$('emg').style.display=fuel<=0?'block':'none';

/* কাজ: ফুয়েল ভরা / যাত্রী নামানো-উঠানো */
const stopped=Math.abs(speed)<1.5;
if(pad&&!wasPad&&!stopped)say(T('stopnow'),2200);
wasPad=pad;
let kind=null;
if(pad&&stopped){if(fz){if(fuel<99.5)kind='f';}else if(ps&&!ps.done)kind=(ps===stops[stops.length-1])?'e':(veh==='bike'?'d':'b');else if(veh==='bus'&&lp&&!lp.done&&(lp.req||(lp.wait>0&&pax<CAP())))kind='l';}
curKind=kind;curStop=ps||lp;
if(job&&job.k!==kind)job=null;
if(job){
const j=job;j.t+=dt;
if(j.k==='f'){fuel=Math.min(100,fuel+30*dt);cash-=30*dt*(veh==='bike'?8:20);if(fuel>=100){job=null;say('✔ '+T('fuel')+' 100%',1500);}}
else if(j.t>=2.5){
const st=j.s;st.done=true;job=null;
if(st.people)st.people.forEach(p=>{p.visible=false;});
if(j.k==='d'){const f=600+((Math.random()*400)|0);cash+=f;carried++;say('📦 +'+f+' '+T('cash'),2500);}
else if(j.k==='l'){localDone(st);}
else{
if(j.k==='e'){
finishTrip();return;
}
const al=(st===stops[0])?0:Math.round(pax*(.25+Math.random()*.4));pax-=al;
const n=Math.min(CAP()-pax,10+((Math.random()*20)|0));pax+=n;carried+=n;
cash+=n*Math.round(2*Math.max(20,(cur.km+st.z*SC/1000)*.6));
say(T('alt')+' '+al+'  ·  '+T('brd')+' '+n,3500);
}
}
}
/* ঘণ্টা: যাত্রী নামতে চাইলে */
bellT-=dt;
if(!bell.on&&bellT<=0&&pax>0){
const nx=locals.find(l=>!l.done&&l.z<pz-150);
if(nx){bell.on=true;bell.stop=nx;nx.req=true;say(T('bell'),4500);ding();bellT=25+Math.random()*25;}else bellT=6;
}
if(bell.on&&pz<bell.stop.z-30){missed++;pax=Math.max(0,pax-1);bell.stop.req=false;bell.on=false;say(T('missed'),3500);}
let lab='',show=false;
if(job){show=true;lab=(job.k==='f'?T('refu')+' '+Math.round(fuel):(veh==='bike'?T('delv'):T('board'))+' '+Math.round(job.t/2.5*100))+'%';}
else if(kind){show=true;lab=kind==='f'?T('actf')+' ('+Math.round((100-fuel)*(veh==='bike'?8:20))+' '+T('cash')+')':(kind==='e'?(veh==='bike'?T('acte2'):T('acte')):kind==='l'?T('actl'):kind==='d'?T('actd'):T('actb'));}
const ab=$('act');ab.style.display=show?'block':'none';if(ab.textContent!==lab)ab.textContent=lab;

/* ট্র্যাফিক */
hitCd-=dt;shake=Math.max(0,shake-dt);
const zz=P.position.z,xx=P.position.x;
sigUpdate();
for(let i=0;i<traffic.length;i++){
const t=traffic[i],u=t.userData;
if(u.dir<0){
let cap=u.sp;
for(let j=0;j<traffic.length;j++){
const o=traffic[j],v=o.userData;
if(j===i||v.dir>0||!o.visible)continue;
const gap=t.position.z-o.position.z;
if(gap>0&&gap<(u.l+v.l)/2+7&&Math.abs(o.position.x-t.position.x)<(u.w+v.w)/2+.3)cap=Math.min(cap,v.cur);
}
const gp=t.position.z-zz;
if(gp>0&&gp<(u.l+PL)/2+7&&Math.abs(xx-t.position.x)<(u.w+PW)/2+.3)cap=Math.min(cap,Math.max(0,speed));
for(const g of sigs){const gap=t.position.z-(g.z+8);if(gap>1&&gap<18+u.cur*1.5&&g.m!=='G')cap=0;}
u.cur+=(cap-u.cur)*Math.min(1,dt*2);
t.position.z-=u.cur*dt;
const dz=zz-t.position.z;
if(inp.h&&dz>3&&dz<55&&Math.abs(t.position.x-xx)<3)u.yl=2.5;
}else{
let cap=u.sp;
for(const g of sigs){const gap=(g.z-8)-t.position.z;if(gap>1&&gap<18+u.cur*1.5&&g.m!=='G')cap=0;}
u.cur+=(cap-u.cur)*Math.min(1,dt*2);t.position.z+=u.cur*dt;
}
u.yl=Math.max(0,u.yl-dt);
const tx=u.bx-(u.yl>0?(u.bx<-4.6?.5:1.4):0)+Math.sin(T0*1.3+i)*u.wob;
t.position.x+=(tx-t.position.x)*Math.min(1,dt*2.2);
if(t.position.z>zz+40){t.position.z=zz-300-Math.random()*250;u.cur=u.sp;t.position.x=u.bx;rollV(t);}
else if(u.dir<0&&t.position.z<zz-450){t.position.z=zz+45;u.cur=u.sp;rollV(t);}
if(t.visible&&hitCd<=0&&Math.abs(t.position.x-xx)<(u.w+PW)/2&&Math.abs(t.position.z-zz)<(u.l+PL)/2){
speed*=.2;hits++;hitCd=1.2;shake=.4;P.position.x+=(xx>=t.position.x?1:-1)*.8;t.position.z+=(t.position.z<zz?-8:8);say(T('hit'),1200);
}
}

for(const g of sigs){
const ln=g.z+8,gd=zz-ln;
if(gd>0&&gd<40&&g.m!=='G'&&speed>6&&!g.warned){g.warned=true;say(T('sigw'),1800);}
if(gd>70)g.warned=false;
if(pz0>ln&&zz<=ln&&g.m==='R'&&speed>1.5){viol++;cash-=500;shake=.3;say(T('red'),3000);}
}
pz0=zz;
for(const c of cross){
const u=c.userData;
if(Math.abs(c.position.z-zz)>350)continue;
const gp=zz-c.position.z,ax=Math.abs(c.position.x);
const wait=u.g?(ax>6.5&&ax<10&&c.position.x*u.d<0&&u.g.c!=='G'):(gp>0&&gp<45&&ax>6.5&&ax<10&&c.position.x*u.d<0);
if(!wait){c.position.x+=u.d*u.sp*dt;if(Math.abs(c.position.x)>75)c.position.x=-u.d*75;}
if(hitCd<=0&&Math.abs(c.position.x-xx)<(u.l+PW)/2&&Math.abs(c.position.z-zz)<(u.w+PL)/2){speed*=.2;hits++;hitCd=1.2;shake=.4;c.position.x+=u.d*3;say(T('hit'),1200);}
}

/* দৃশ্য ঘুরানো */
ground.position.z=road.position.z=edgeL.position.z=edgeR.position.z=zz;
for(const d of dashes)if(d.position.z>zz+20)d.position.z-=360;
for(const o of scen)if(o.position.z>zz+30){o.position.z-=420;skin(o);}
envUpdate(dt);if(weather==='rain'){rainUpdate(dt);for(const w of wipers)w.rotation.z=.1+(Math.sin(T0*4)+1)*.55;}
for(const p of peds){
p.position.z+=p.userData.v*dt;
p.position.y=Math.abs(Math.sin(T0*6+p.userData.x))*.06;
if(p.position.z>zz+25||p.position.z<zz-140){p.position.z=zz-25-Math.random()*100;}
}

/* ক্যামেরা */
const px2=P.position.x;
if(camMode==='out'){
const zc=zz+CFG.o[2],zl=zz+CFG.look[1];
camera.position.set(px2*.85+C(zc),CFG.o[1],zc);camera.lookAt(px2+C(zl),CFG.look[0],zl);
}else{
const zc=zz+CFG.c[2];
camera.position.set(px2+CFG.c[0]+C(zc),CFG.c[1]+Math.sin(T0*35)*.004*(Math.abs(speed)/CFG.max+rpm/6000),zc);
camera.rotation.set(0,P.rotation.y+Math.atan(Cp(zc)),0);if(wheelSpin)wheelSpin.rotation.z=-steer*1.2;
}
hl.position.set(px2+C(zz-5),1.4,zz-5);hl.target.position.set(px2+C(zz-40),0,zz-40);
if(shake>0)camera.position.y+=(Math.random()-.5)*shake*.4;
sound(on,thr);

/* HUD */
fc++;
if(fc%6===0){
$('gn').textContent=(inp.rv&&speed<=.3)?'R':(gear||'N');
$('gr').textContent=T('gear')+' '+$('gn').textContent+'  ·  '+(Math.round(rpm*(veh==='bike'?3.2:1)/10)*10)+' RPM  ·  🕒 '+String(Math.floor(hour)).padStart(2,'0')+':'+String(Math.floor(hour%1*60)).padStart(2,'0');
$('spd').textContent=(speed<-.1?'R ':'')+Math.round(Math.abs(speed)*3.6);
$('fi').style.width=fuel+'%';$('fi').style.background=fuel<15?'#ef4444':'#22c55e';
const nx=stops.find(s=>!s.done);
$('st').textContent=T('fuel')+' '+Math.round(fuel)+'%  ·  '+T('cash')+' '+Math.round(cash)+'  ·  '+(veh==='bike'?T('parc')+' '+carried:T('pax')+' '+pax+'/'+CAP());
const nf=fuels.find(z=>z<zz+10);
$('rt').textContent=(nx?T('next')+': '+nx.n[li()]+' ('+Math.max(0,Math.round(Math.abs(zz-nx.z)*SC/1000))+' '+T('left')+')':'')+(nf!==undefined?'\n'+T('fst')+': '+Math.round(Math.abs(zz-nf)*SC/1000)+' '+T('left'):'')+(bell.on?'\n🔔 '+T('bellq')+': '+bell.stop.nm[li()]+' ('+(Math.abs(zz-bell.stop.z)*SC/1000).toFixed(1)+' '+T('left')+')':'');
}
}
function audioHush(){if(en)en.g.gain.value=0;if(hornO)hornO.gain.value=0;}

applyLang();showMenu('');
let last=performance.now(),T1=0,chk=0,fAcc=0,fN=0;
function checkShaders(){
if(bendOff)return;
const ps=renderer.info.programs||[];
if(ps.some(p=>p.diagnostics&&p.diagnostics.runnable===false)){bendOff=true;bentMats.forEach(m=>{m.onBeforeCompile=()=>{};m.needsUpdate=true;});say('বাঁকা রাস্তা এই ফোনে চলছে না, সোজা রাস্তায় চলছে',4000);}
}
function loop(now){
const dt=Math.min(.05,(now-last)/1000);last=now;T1+=dt;
if(state==='play')update(dt,T1);
else if(state==='end'||state==='menu')audioHush();
if(state==='play'&&tm>4){fAcc+=dt;if(++fN>=150){if(fN/fAcc<24&&gi>0)setGfx(gi-1,true);fN=0;fAcc=0;}}
renderer.render(scene,camera);
if(++chk===8||chk===90)checkShaders();
requestAnimationFrame(loop);
}
camera.position.set(0,6.5,15);setBus();
requestAnimationFrame(loop);
})();
</script>
<script>
if('serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
var dp=null;
window.addEventListener('beforeinstallprompt',function(e){
e.preventDefault();dp=e;
var b=document.createElement('button');b.textContent='\ud83d\udcf2 \u0985\u09cd\u09af\u09be\u09aa \u09b9\u09bf\u09b8\u09c7\u09ac\u09c7 \u0987\u09a8\u09b8\u09cd\u099f\u09b2 / Install app';
b.style.cssText='display:block;margin:12px auto 0;background:#7c3aed';
b.onclick=function(){dp.prompt();b.remove();};
document.getElementById('menu').appendChild(b);
});
</script>
